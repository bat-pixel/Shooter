<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,user-scalable=no"name=viewport><title>Sky Fire Patrol</title><style>*,::after,::before{box-sizing:border-box;margin:0;padding:0}body{background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;overflow:hidden;font-family:'Courier New',monospace;color:#aaa}#canvas-wrap{position:relative;line-height:0}canvas#canvas{display:block;width:min(100vw,calc(100dvh * 9 / 16));height:min(100dvh,calc(100vw * 16 / 9));image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);gap:16px;pointer-events:none}#overlay.hidden{display:none}.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#7af;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#progress-bar{width:200px;height:6px;background:#222;border-radius:3px;overflow:hidden}#progress-fill{height:100%;background:#7af;border-radius:3px;width:0%;transition:width .2s}#status-text{font-size:12px;letter-spacing:.05em;color:#666}</style></head><body><div id=canvas-wrap><canvas id=canvas oncontextmenu=event.preventDefault()></canvas><div id=overlay><div class=spinner></div><div id=progress-bar><div id=progress-fill></div></div><div id=status-text>Loading…</div></div></div><script>var statusEl=document.getElementById("status-text"),fillEl=document.getElementById("progress-fill"),overlayEl=document.getElementById("overlay"),Module={canvas:document.getElementById("canvas"),setStatus:function(t){if(t){var e=t.match(/(\d+)\/(\d+)/);e&&(fillEl.style.width=100*parseInt(e[1])/parseInt(e[2])+"%"),statusEl.textContent=t.replace(/\([\d /]+\)/,"").trim()}else overlayEl.classList.add("hidden")},onRuntimeInitialized:function(){overlayEl.classList.add("hidden")},print:function(t){console.log(t)},printErr:function(t){console.error(t)},quit:function(t){0!==t&&console.error("Exit code",t)}}</script><script async src=index.js></script></body></html>
