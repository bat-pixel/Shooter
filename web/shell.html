<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Sky Fire Patrol</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #aaa;
    }

    #canvas-wrap {
      position: relative;
      line-height: 0;
    }

    canvas#canvas {
      display: block;
      /* Keep 9:16 aspect, fill the viewport without overflow */
      width:  min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      gap: 16px;
      pointer-events: none;
    }
    #overlay.hidden { display: none; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #7af;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #progress-bar {
      width: 200px;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: #7af;
      border-radius: 3px;
      width: 0%;
      transition: width 0.2s;
    }
    #status-text {
      font-size: 12px;
      letter-spacing: 0.05em;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div id="overlay">
      <div class="spinner"></div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="status-text">Loading…</div>
    </div>
  </div>

  <script>
    var statusEl   = document.getElementById('status-text');
    var fillEl     = document.getElementById('progress-fill');
    var overlayEl  = document.getElementById('overlay');

    var Module = {
      canvas: document.getElementById('canvas'),

      setStatus: function(msg) {
        if (!msg) {
          overlayEl.classList.add('hidden');
          return;
        }
        // Parse "Downloading data... (N/M)" for the progress bar
        var m = msg.match(/(\d+)\/(\d+)/);
        if (m) {
          fillEl.style.width = (100 * parseInt(m[1]) / parseInt(m[2])) + '%';
        }
        statusEl.textContent = msg.replace(/\([\d /]+\)/, '').trim();
      },

      onRuntimeInitialized: function() {
        overlayEl.classList.add('hidden');
      },

      print:    function(t) { console.log(t); },
      printErr: function(t) { console.error(t); },

      // Suppress "exit(0)" from emscripten_cancel_main_loop
      quit: function(code) {
        if (code !== 0) console.error('Exit code', code);
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
